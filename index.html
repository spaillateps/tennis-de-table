<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournoi ATP de la classe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w1:#e3f4e8;--w2:#bfe5cb;--w3:#8fd1a6;--bg:#f6f4f3;--card:#fff;--ink:#241c1d;--mut:#6a6061;--line:#e4dddd;--green:#c8102e;--green2:#f8e7e9;--head:#2a2a2e;--ball:#e30613;--pos:#1b7a4b;--neg:#a30f1f;--onG:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#1f3d2c;--w2:#2a5a3e;--w3:#357a50;--bg:#151314;--card:#1f1b1c;--ink:#f1ebeb;--mut:#a89d9e;--line:#352e2f;--green:#ef5360;--green2:#3a2326;--head:#1a1a1d;--ball:#ff4b57;--pos:#5fd39a;--neg:#ff8a7a;--onG:#1a0709}}
:root[data-theme="dark"]{--w1:#1f3d2c;--w2:#2a5a3e;--w3:#357a50;--bg:#151314;--card:#1f1b1c;--ink:#f1ebeb;--mut:#a89d9e;--line:#352e2f;--green:#ef5360;--green2:#3a2326;--head:#1a1a1d;--ball:#ff4b57;--pos:#5fd39a;--neg:#ff8a7a;--onG:#1a0709}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--head);color:#fff;padding:14px 16px 0}
.in{max-width:1100px;margin:0 auto;position:relative}
footer{text-align:center;color:var(--mut);font-size:14px;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
h1{margin:0;padding-right:64px}
#logo{position:absolute;top:-14px;right:0;height:88px;width:auto}
#cl{font-size:15px;opacity:.85;margin:2px 0 8px}
h1 input{width:100%;background:transparent;border:0;border-bottom:2px dashed transparent;color:#fff;font:700 clamp(28px,6vw,44px)/1.1 "Barlow Condensed",Barlow,sans-serif;padding:2px 0}
h1 input:hover,h1 input:focus{border-bottom-color:rgba(255,255,255,.5);outline:0}
nav{display:flex;overflow-x:auto;gap:2px;margin-top:6px}
nav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#d9d6d6;font:600 15px/1 Barlow,system-ui,sans-serif;padding:12px 14px;white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--ball)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,370px) minmax(0,1fr);align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid .card:last-child{margin-bottom:0}
h2{font:700 24px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 10px}
h3{font:600 17px/1.2 Barlow,sans-serif;margin:16px 0 6px}
p{margin:6px 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mut);font-weight:600;font-size:13px;padding:6px}
td{padding:7px 6px;border-top:1px solid var(--line)}
.n{text-align:right}
small{color:var(--mut)}
.rk{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--green2);font:700 16px/1 "Barlow Condensed",sans-serif}
.r1{background:var(--ball);color:#fff}
.r2,.r3{box-shadow:inset 0 0 0 2px var(--ball)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
select,input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
td input{padding:5px 8px}
textarea{min-height:90px;font:13px/1.3 monospace}
.btn{background:var(--green);color:var(--onG);border:1px solid var(--green);border-radius:8px;padding:10px 14px;font:600 15px/1 Barlow,system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 120px}
.row>.btn{flex:0 0 auto}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pv{background:var(--green2);padding:10px 12px;border-radius:8px}
.hint{color:var(--mut);font-size:14px}
.warn{color:var(--neg);font-size:14px}
.empty{color:var(--mut);padding:12px 0}
.av{width:36px;height:48px;border-radius:6px;object-fit:cover;background:var(--green2);vertical-align:middle;flex:none}
.av.s{width:24px;height:32px;border-radius:4px}
.av.l{width:60px;height:80px;border-radius:8px}
span.av{display:inline-grid;place-items:center;font:700 15px/1 "Barlow Condensed",sans-serif;color:var(--green)}
.who{display:flex;align-items:center;gap:10px}
.vs{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.vs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;max-width:100px;text-align:center}
.pup{position:relative;display:inline-block;cursor:pointer}
.pup input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;padding:0;border:0}
.gps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.gp{border:1px solid var(--line);border-radius:8px;padding:4px 12px 8px}
.gp h3{margin:8px 0 4px}
.gp .who{margin:8px 0}
.ck{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink);font-size:16px}
.ck input{width:auto}
summary{cursor:pointer}
.st{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn.sec.on{background:var(--green2);border-color:var(--green);color:var(--ink)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.sides{grid-template-columns:minmax(0,1fr)}}
.side{border:1px solid var(--line);border-radius:8px;padding:4px 14px 12px;transition:background .3s}
.side.w1{background:var(--w1)}
.side.w2{background:var(--w2)}
.side.w3{background:var(--w3)}
.side .who{margin:12px 0 4px}
.bigw{margin-left:auto;text-align:right}
.big{font:700 56px/1 "Barlow Condensed",Barlow,sans-serif;color:var(--green);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.rkl{list-style:none;margin:0;padding:0}
.rkl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rkl .rl{flex:1}
.pl .btn{margin-top:6px}
.pl.absent .who span{color:var(--neg);font-weight:700}
.pl.absent img.av{filter:sepia(1) saturate(6) hue-rotate(-35deg);outline:3px solid var(--neg)}
.pl.absent span.av{background:var(--neg);color:#fff}
.btn.sec.abs-on{background:var(--neg);border-color:var(--neg);color:#fff}
.stp{display:flex;gap:8px;align-items:center}
.stp input{width:96px;height:56px;font-size:24px;text-align:center}
.stp .btn{min-width:64px;height:56px;padding:0;font-size:32px;line-height:1}
.chips .btn{min-height:48px;padding:10px 16px;font-size:16px}
.btn.sm{min-height:44px;padding:10px 16px;font-size:16px}
select,.row input{min-height:46px}
nav button{padding:14px 16px}
.stp b{min-width:44px;text-align:center;font-size:28px}
.ob{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
</style>
</head>

<main id="app"></main>

<script>
const KEY="atp-tournoi-v1";
const NAMES=[];
const PHOTOS=[];
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const av=(p,c="")=>{if(!p)return"";const s=LINK?"":(p.photo||(p.id>=1&&p.id<=PHOTOS.length?PHOTOS[p.id-1]:""));return s?`<img class="av ${c}" src="${s}" alt="${esc(p.name)}">`:`<span class="av ${c}" aria-hidden="true">${esc(initials(p.name))}</span>`};
const DEF=()=>[[-50,2,1],[-10,3,0],[-4,4,-1],[0,6,-2],[5,8,-3],[11,10,-4]];
const fresh=()=>({title:"Tennis de table 4ème",players:NAMES.map((n,i)=>({id:i+1,name:n,init:100})),matches:[],bar:DEF(),arch:[],nid:100});
let S=fresh();
try{const j=localStorage.getItem(KEY);if(j)S=JSON.parse(j)}catch(e){}
const MK="atp-mode-v1";let MODE={on:false,pin:""};
try{const m=JSON.parse(localStorage.getItem(MK));if(m&&m.on)MODE=m}catch(e){}
const saveMode=()=>{try{localStorage.setItem(MK,JSON.stringify(MODE))}catch(e){}};
const STUT=["tournoi","tour","joueur"],STUA=["tab","med","mbadd","mbchrono","rec","tsel","ttab","tmat","toc","tsc","tscx","tabs","tog","unl","modeoff"],STUC=["w","l","d","pj","st","tscore","tterr","medsig"];
const QS=new URLSearchParams(location.search),LINK=QS.has("eleve"),DBURL=(QS.get("db")||"").replace(/\/+$/,"");
let SY={url:"",secret:""};try{const y=JSON.parse(localStorage.getItem("atp-sync-v1"));if(y&&y.url)SY=y}catch(e){}
if(LINK){S={title:"Tennis de table 4ème",players:[],matches:[],bar:DEF(),arch:[],nid:100,tours:[]};MODE={on:true,pin:"",link:true}}
const save=()=>{if(LINK)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushSnap()};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>s?s.split("-").reverse().join("/"):"";
const sg=n=>(n>0?"+":n<0?"−":"")+Math.abs(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const P=id=>S.players.find(p=>p.id==id);
const TABS=[["tournoi","Défis"],["tour","Tournoi"],["matchs","Matchs"],["joueur","Fiches élèves"],["groupes","Groupements"],["joueurs","Joueurs"],["bareme","Barème et règles"],["recap","Récap leçons"],["archives","Archives et sauvegarde"],["classe","Changer la classe"]];
let ui={tab:TABS.some(t=>"#"+t[0]==location.hash)?location.hash.slice(1):"tournoi",w:"",l:"",date:today(),open:{},pj:"",ab:{},gs:3,gd:false,tt:0,tm:0,ts:4,od:false,tn:0,tk:"c",imp:{rows:[],msg:"",busy:false,cls:"",init:100,sw:true}};

const barFor=d=>{let r=S.bar[0];for(const b of S.bar)if(d>=b[0])r=b;return r};
const rankOf=(pts,p)=>{let n=1;for(const k in pts)if(pts[k]>p)n++;return n};

function compute(){
  const pts={},st={};
  S.players.forEach(p=>{pts[p.id]=+p.init;st[p.id]={m:0,w:0,l:0}});
  const log=S.matches.map(m=>{
    const rw=rankOf(pts,pts[m.w]),rl=rankOf(pts,pts[m.l]),b=barFor(rw-rl);
    pts[m.w]+=b[1];pts[m.l]+=b[2];
    st[m.w].m++;st[m.w].w++;st[m.l].m++;st[m.l].l++;
    return {id:m.id,date:m.date,wi:m.w,li:m.l,wn:P(m.w).name,ln:P(m.l).name,rw,rl,pw:b[1],pl:b[2]};
  });
  const rows=S.players.map(p=>({id:p.id,name:p.name,init:+p.init,pts:pts[p.id],...st[p.id]}));
  rows.sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name,"fr"));
  rows.forEach(r=>r.rank=rankOf(pts,r.pts));
  return {pts,rows,log};
}

const tblRank=rows=>rows.length?`<div class="scroll"><table><thead><tr><th>Rang</th><th>Joueur</th><th class="n">Points</th><th class="n">Évol.</th><th class="n">Matchs</th><th class="n">V</th><th class="n">D</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="rk r${r.rank<4?r.rank:0}">${r.rank}</span></td><td><div class="who">${av(P(r.id),"s")}<span>${esc(r.name)}</span></div></td><td class="n"><b>${r.pts}</b></td><td class="n ${r.pts>r.init?"pos":r.pts<r.init?"neg":""}">${sg(r.pts-r.init)}</td><td class="n">${r.m}</td><td class="n">${r.w}</td><td class="n">${r.l}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Aucun joueur. Ajoutez-en dans l’onglet Joueurs.</p>`;

const tblMatches=(list,del)=>list.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Vainqueur (rang)</th><th>Perdant (rang)</th><th class="n">Pts vainq.</th><th class="n">Pts perd.</th>${del?"<th></th>":""}</tr></thead><tbody>${list.slice().reverse().map(m=>`<tr><td>${fd(m.date)}</td><td><div class="who">${av(P(m.wi),"s")}<span><b>${esc(m.wn)}</b> <small>(${m.rw})</small></span></div></td><td><div class="who">${av(P(m.li),"s")}<span>${esc(m.ln)} <small>(${m.rl})</small></span></div></td><td class="n pos">${sg(m.pw)}</td><td class="n neg">${sg(m.pl)}</td>${del?`<td class="n"><button class="btn sec sm" data-a="delm" data-v="${m.id}" data-c="1">Supprimer</button></td>`:""}</tr>`).join("")}</tbody></table></div>`:`<p class="empty">Aucun match enregistré.</p>`;

function vTour(C){
  const opts=sel=>`<option value="">Choisir un joueur</option>`+C.rows.map(r=>`<option value="${r.id}"${sel==r.id?" selected":""}>${r.rank}. ${esc(r.name)} (${r.pts} pts)</option>`).join("");
  let pv="",ok=false;
  if(ui.w&&ui.l){
    if(ui.w==ui.l)pv=`<p class="warn">Choisissez deux joueurs différents.</p>`;

function recStats(){
  const E=[];Object.keys(S.mba||{}).forEach(o=>(S.mba[o]||[]).forEach(x=>{if(P(+o)&&P(x.p))E.push({a:+o,b:x.p,n:x.n})}));

  const pc={};E.forEach(e=>{[[e.a,e.b],[e.b,e.a]].forEach(([me,y])=>{if(e.n>0&&e.n==rec[y]){(pc[me]=pc[me]||new Set()).add(y)}})});
  return {rec,pc};
}

const gl=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):"");
function sizesFor(n,s){
  if(n<2)return n?[n]:[];
  const g=Math.max(1,s==2?Math.floor(n/2):Math.ceil(n/s)),b=Math.floor(n/g),x=n%g;
  return Array.from({length:g},(_,i)=>b+(i<x?1:0));

function homog(list,s){

function hetero(list,s){
  const n=list.length,sz=sizesFor(n,s),g=sz.length;
  if(g<2)return g?[list.slice()]:[];
  const R=Math.max(...sz),ix=new Map(list.map((x,i)=>[x,i+1]));
  let small=0;
  const rounds=sz.map(m=>{
    if(m==R)return Array.from({length:R},(_,r)=>r);
    const f=(small++%2)?Math.floor:Math.ceil;
    return Array.from({length:m},(_,i)=>f(i*(R-1)/(m-1)));
  });

  rounds.forEach((rs,gi)=>rs.forEach(r=>slotG[r].push(gi)));
  const blocks=[];let p=0;
  slotG.forEach(sg2=>{blocks.push(list.slice(p,p+sg2.length));p+=sg2.length});
  const target=(n+1)/2;
  let seed=12345;
  const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  let best=null,bc=Infinity;
  for(let t=0;t<30&&bc>1e-9;t++){
    const A=blocks.map((b,r)=>t?shuf(b):(r%2?b.slice().reverse():b.slice()));
    const sums=Array(g).fill(0);
    A.forEach((arr,r)=>arr.forEach((x,j)=>{sums[slotG[r][j]]+=ix.get(x)}));
    const cost=()=>sums.reduce((s,v,i)=>s+(v/sz[i]-target)**2,0);
    for(let pass=0,imp=true;imp&&pass<50;pass++){
      imp=false;
      A.forEach((arr,r)=>{
        for(let a=0;a<arr.length;a++)for(let b=a+1;b<arr.length;b++){
          const ga=slotG[r][a],gb=slotG[r][b];
          if(ga==gb)continue;
          const d=ix.get(arr[b])-ix.get(arr[a]),c0=cost();
          sums[ga]+=d;sums[gb]-=d;
          if(cost()<c0-1e-9){[arr[a],arr[b]]=[arr[b],arr[a]];imp=true}

        }

  best.forEach((arr,r)=>arr.forEach((x,j)=>G[slotG[r][j]].push(x)));

}

  else if(a=="tnext"&&S.tours.length){
    const cur=S.tours[S.tours.length-1],g=nextGroups(cur,ui.tk);
    S.tours.push({moves:g.moves,notes:g.notes,tables:g.pl.map((pl,k)=>({pl,terrain:cur.tables[k].terrain,m:{},ab:{}}))});
    ui.tn=S.tours.length-1;ui.tt=0;ui.tm=0;
  }
  else if(a=="tdel"&&TR()){S.tours.splice(ui.tn,1);ui.tn=Math.max(0,ui.tn-1);ui.tt=0;ui.tm=0}
  else if(a=="tsc"&&TB){const d=v.split(",").map(Number);E({t:"tsc",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:d[0],d:d[1]})}
  else if(a=="toc"&&TB){const d=v.split(",").map(Number);E({t:"toc",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:d[0],k:d[1],d:d[2]})}
  else if(a=="tscx"&&TB)E({t:"tscx",ti:ui.tn,tt:ui.tt,mi:ui.tm})
  else if(a=="rec"){if(!P(ui.w)||!P(ui.l)||ui.w==ui.l)return;E({t:"rec",w:+ui.w,l:+ui.l,date:ui.date});ui.flash="Match enregistré : "+nm(+ui.w)+" bat "+nm(+ui.l)+".";ui.w=ui.l=""}
  else if(a=="modeon"){const c=($("#mpin").value||"").trim();if(!c){ui.mmsg="Choisissez d’abord un code.";save();render();return}MODE={on:true,pin:c};saveMode();ui.tab="tournoi";ui.unl=false}
  else if(a=="med"){const d=v.split(",").map(Number);if(P(ui.pj))E({t:"med",pid:+ui.pj,e:d[0],k:d[1]})}
  else if(a=="mbadd"){
    const n=Math.floor(+$("#mbn").value),pt=+$("#mbp").value,pid=ui.pj;
    if(!P(pid)||!pt||pt==pid||!(n>=0)||$("#mbn").value===""){ui.mmsg="";return}
    E({t:"mbadd",pid:+pid,p:pt,n,date:today()});
  }
  else if(a=="mbdel"){const d=v.split(",").map(Number),L=S.mba&&S.mba[d[0]];if(L)L.splice(d[1],1)}
  else if(a=="mbchrono"){
    clearInterval(chrT);let t=60;
    const show=()=>{const e=$("#mbt");if(!e){clearInterval(chrT);return}e.textContent=t>0?Math.floor(t/60)+":"+String(t%60).padStart(2,"0"):"Stop !";e.style.color=t>0?"":"var(--neg)"};
    show();
    chrT=setInterval(()=>{t--;show();if(t<=0){clearInterval(chrT);try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator();o.connect(A.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),700)}catch(e){}}},1000);
    return;
  }
  else if(a=="sysave"){
    const u=($("#syu").value||"").trim().replace(/\/+$/,""),k=($("#sys").value||"").trim();
    SY={url:u,secret:k};try{localStorage.setItem("atp-sync-v1",JSON.stringify(SY))}catch(e){}
    ui.sy=u&&k?"Test de connexion…":"Réglages effacés.";if(u&&k)doPush();startSync();
  }
  else if(a=="unl")ui.unl=!ui.unl
  else if(a=="modeoff"){if(($("#mpin2").value||"").trim()==MODE.pin){MODE={on:false,pin:""};saveMode();ui.unl=false;ui.mmsg=""}else ui.mmsg="Code incorrect."}
  else if(a=="delm")S.matches=S.matches.filter(m=>m.id!=v);
  else if(a=="addp"){const n=$("#pn").value.trim();if(!n)return;S.players.push({id:S.nid++,name:n,init:+$("#pp").value||0})}
  else if(a=="delp"){S.players=S.players.filter(p=>p.id!=v);S.matches=S.matches.filter(m=>m.w!=v&&m.l!=v)}
  else if(a=="deg"){const s=+$("#ds").value||0;C.rows.forEach((r,i)=>{P(r.id).init=s-i})}
  else if(a=="barreset")S.bar=DEF();
  else if(a=="tog")ui.open[v]=!ui.open[v];
  else if(a=="dela")S.arch=S.arch.filter(x=>x.id!=v);
  else if(a=="arch"){
    S.arch.push({id:S.nid++,name:$("#an").value.trim()||"Séance du "+fd(today()),date:today(),rows:C.rows,log:C.log.map(m=>({date:m.date,wi:m.wi,li:m.li,wn:m.wn,ln:m.ln,rw:m.rw,rl:m.rl,pw:m.pw,pl:m.pl}))});
    C.rows.forEach(r=>{P(r.id).init=r.pts});S.matches=[];
  }
  else if(a=="imp"){try{const d=JSON.parse($("#imp").value);if(!Array.isArray(d.players)||!Array.isArray(d.matches)||!Array.isArray(d.bar))throw 0;S=d}catch(e){alert("Sauvegarde invalide : collez le texte complet copié depuis cette page.");return}}
  else if(a=="reset")S=fresh();
  else if(a=="impadd"){const I=ui.imp;$("#impt").value.split(/\n/).map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean).forEach(x=>I.rows.push({name:x,photo:"",on:true}));I.msg=""}
  else if(a=="impclr"){ui.imp.rows=[];ui.imp.msg=""}
  else if(a=="impgo"){
    const I=ui.imp,rows=I.rows.filter(r=>r.on&&r.name.trim());if(!rows.length)return;
    const sn=snapS(),cl=(S.classes||[]).concat([sn]);
    S={title:S.title,players:rows.map(r=>{const q={id:S.nid++,name:r.name.trim(),init:+I.init||0};if(r.photo)q.photo=r.photo;return q}),matches:[],bar:S.bar,arch:[],nid:S.nid,tours:[],obs:S.obs,classes:cl,cls:I.cls.trim()};
    resetUiClass();ui.imp={rows:[],msg:"",busy:false,cls:"",init:I.init,sw:I.sw};ui.tab="joueurs";
  }
  else if(a=="clsrest"){
    const c=(S.classes||[]).find(x=>x.id==v);if(!c)return;
    const sn=snapS(),cl=(S.classes||[]).filter(x=>x.id!=v).concat([sn]),d=JSON.parse(c.data);
    d.classes=cl;d.nid=Math.max(d.nid||0,S.nid);S=d;resetUiClass();ui.tab="tournoi";
  }
  save();render();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  if(b.dataset.c&&!b.classList.contains("armed")){
    const t=b.textContent;b.classList.add("armed");b.textContent="Confirmer ?";
    setTimeout(()=>{b.classList.remove("armed");b.textContent=t},3000);return;
  }
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset.ch;if(!k)return;
  if(MODE.on&&!STUC.includes(k))return;
  if(k=="medsig"){
    if(P(ui.pj))E({t:"medsig",pid:+ui.pj,e:+t.dataset.v,v:t.value?+t.value:0});
    save();render();return;
  }
  if(k=="impf"){const fs=Array.from(t.files||[]);t.value="";if(fs.length)importFiles(fs);return}
  if(k=="impon"){ui.imp.rows[+t.dataset.i].on=t.checked;render();return}
  if(k=="impn"){ui.imp.rows[+t.dataset.i].name=t.value;render();return}
  if(k=="impc"){ui.imp.cls=t.value;return}
  if(k=="impi"){ui.imp.init=+t.value||0;return}
  if(k=="impsw"){ui.imp.sw=t.checked;return}
  if(k=="photo"){
    const f=t.files&&t.files[0],p=P(t.dataset.v);if(!f||!p)return;
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=96;c.height=128;
      const r=Math.max(96/img.width,128/img.height),w=img.width*r,h=img.height*r;
      c.getContext("2d").drawImage(img,(96-w)/2,(128-h)/2,w,h);
      p.photo=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(u);save();render();
    };
    img.onerror=()=>{URL.revokeObjectURL(u);alert("Image illisible : choisissez un fichier JPG ou PNG.")};
    img.src=u;return;
  }
  const TB=TR()&&TR().tables[ui.tt];
  if(k=="tsz")ui.ts=+t.value;
  else if(k=="tk")ui.tk=t.value;
  else if(k=="tterr"&&TB)E({t:"tterr",ti:ui.tn,tt:ui.tt,v:t.value});
  else if(k=="tscore"&&TB){const v=t.value===""?null:Math.max(0,Math.floor(+t.value)||0);E({t:"tscore",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:+t.dataset.p,v})}
  else if(k=="st"&&TB)E({t:"st",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:+t.dataset.p,k:t.dataset.k,v:t.value===""?null:(["pf","pf2","pt","pt2"].includes(t.dataset.k)?t.value:+t.value)});
  else if(k=="oname"){S.obs[+t.dataset.i].n=t.value.trim();ui.od=true}
  else if(k=="ow"){S.obs[+t.dataset.i].w=+t.value||0;ui.od=true}
  else if(k=="ocount"){S.obs[+t.dataset.i].c=t.checked;ui.od=true}
  else if(k=="pj")ui.pj=t.value;
  else if(k=="gs")ui.gs=+t.value;
  else if(k=="pres"){ui.ab[t.dataset.v]=!t.checked;ui.gd=true}
  else if(k=="w")ui.w=t.value;
  else if(k=="l")ui.l=t.value;
  else if(k=="d")ui.date=t.value||today();
  else if(k=="ren")P(t.dataset.v).name=t.value.trim()||P(t.dataset.v).name;
  else if(k=="init")P(t.dataset.v).init=+t.value||0;
  else if(k=="bar"){S.bar[t.dataset.i][t.dataset.j]=+t.value;S.bar.sort((a,b)=>a[0]-b[0])}
  else if(k=="title")S.title=t.value.trim()||"Tennis de table 4ème";
  save();render();
});
render();
if(LINK){pullSnap();setInterval(pullSnap,4000)}else if(SY.url&&SY.secret){doPush();startSync()}
</script>
</body>
</html>
