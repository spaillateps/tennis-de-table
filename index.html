<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis de table</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tennis de table">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2a2a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w1:#e3f4e8;--w2:#bfe5cb;--w3:#8fd1a6;--bg:#f6f4f3;--card:#fff;--ink:#241c1d;--mut:#6a6061;--line:#e4dddd;--green:#c8102e;--green2:#f8e7e9;--head:#2a2a2e;--ball:#e30613;--pos:#1b7a4b;--neg:#a30f1f;--onG:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#1f3d2c;--w2:#2a5a3e;--w3:#357a50;--bg:#151314;--card:#1f1b1c;--ink:#f1ebeb;--mut:#a89d9e;--line:#352e2f;--green:#ef5360;--green2:#3a2326;--head:#1a1a1d;--ball:#ff4b57;--pos:#5fd39a;--neg:#ff8a7a;--onG:#1a0709}}
:root[data-theme="dark"]{--w1:#1f3d2c;--w2:#2a5a3e;--w3:#357a50;--bg:#151314;--card:#1f1b1c;--ink:#f1ebeb;--mut:#a89d9e;--line:#352e2f;--green:#ef5360;--green2:#3a2326;--head:#1a1a1d;--ball:#ff4b57;--pos:#5fd39a;--neg:#ff8a7a;--onG:#1a0709}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--head);color:#fff;padding:14px 16px 0}
.in{max-width:1100px;margin:0 auto;position:relative}
footer{text-align:center;color:var(--mut);font-size:14px;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
h1{margin:0;padding-right:64px}
#logo{position:absolute;top:-14px;right:0;height:88px;width:auto}
#cl{font-size:15px;opacity:.85;margin:2px 0 8px}
h1 input{width:100%;background:transparent;border:0;border-bottom:2px dashed transparent;color:#fff;font:700 clamp(28px,6vw,44px)/1.1 "Barlow Condensed",Barlow,sans-serif;padding:2px 0}
h1 input:hover,h1 input:focus{border-bottom-color:rgba(255,255,255,.5);outline:0}
nav{display:flex;overflow-x:auto;gap:2px;margin-top:6px}
nav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#d9d6d6;font:600 15px/1 Barlow,system-ui,sans-serif;padding:12px 14px;white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--ball)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,370px) minmax(0,1fr);align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid .card:last-child{margin-bottom:0}
h2{font:700 24px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 10px}
h3{font:600 17px/1.2 Barlow,sans-serif;margin:16px 0 6px}
p{margin:6px 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mut);font-weight:600;font-size:13px;padding:6px}
td{padding:7px 6px;border-top:1px solid var(--line)}
.n{text-align:right}
small{color:var(--mut)}
.rk{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--green2);font:700 16px/1 "Barlow Condensed",sans-serif}
.r1{background:var(--ball);color:#fff}
.r2,.r3{box-shadow:inset 0 0 0 2px var(--ball)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
select,input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
td input{padding:5px 8px}
textarea{min-height:90px;font:13px/1.3 monospace}
.btn{background:var(--green);color:var(--onG);border:1px solid var(--green);border-radius:8px;padding:10px 14px;font:600 15px/1 Barlow,system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 120px}
.row>.btn{flex:0 0 auto}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pv{background:var(--green2);padding:10px 12px;border-radius:8px}
.hint{color:var(--mut);font-size:14px}
.warn{color:var(--neg);font-size:14px}
.empty{color:var(--mut);padding:12px 0}
.av{width:36px;height:48px;border-radius:6px;object-fit:cover;background:var(--green2);vertical-align:middle;flex:none}
.av.s{width:24px;height:32px;border-radius:4px}
.av.l{width:60px;height:80px;border-radius:8px}
span.av{display:inline-grid;place-items:center;font:700 15px/1 "Barlow Condensed",sans-serif;color:var(--green)}
.who{display:flex;align-items:center;gap:10px}
.vs{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.vs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;max-width:100px;text-align:center}
.pup{position:relative;display:inline-block;cursor:pointer}
.pup input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;padding:0;border:0}
.gps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.gp{border:1px solid var(--line);border-radius:8px;padding:4px 12px 8px}
.gp h3{margin:8px 0 4px}
.gp .who{margin:8px 0}
.ck{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink);font-size:16px}
.ck input{width:auto}
summary{cursor:pointer}
.st{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn.sec.on{background:var(--green2);border-color:var(--green);color:var(--ink)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.sides{grid-template-columns:minmax(0,1fr)}}
.side{border:1px solid var(--line);border-radius:8px;padding:4px 14px 12px;transition:background .3s}
.side.w1{background:var(--w1)}
.side.w2{background:var(--w2)}
.side.w3{background:var(--w3)}
.side .who{margin:12px 0 4px}
.bigw{margin-left:auto;text-align:right}
.big{font:700 56px/1 "Barlow Condensed",Barlow,sans-serif;color:var(--green);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.rkl{list-style:none;margin:0;padding:0}
.rkl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rkl .rl{flex:1}
.pl .btn{margin-top:6px}
.pl.absent .who span{color:var(--neg);font-weight:700}
.pl.absent img.av{filter:sepia(1) saturate(6) hue-rotate(-35deg);outline:3px solid var(--neg)}
.pl.absent span.av{background:var(--neg);color:#fff}
.btn.sec.abs-on{background:var(--neg);border-color:var(--neg);color:#fff}
.stp{display:flex;gap:8px;align-items:center}
.stp input{width:96px;height:56px;font-size:24px;text-align:center}
.stp .btn{min-width:64px;height:56px;padding:0;font-size:32px;line-height:1}
.chips .btn{min-height:48px;padding:10px 16px;font-size:16px}
.btn.sm{min-height:44px;padding:10px 16px;font-size:16px}
select,.row input{min-height:46px}
nav button{padding:14px 16px}
.stp b{min-width:44px;text-align:center;font-size:28px}
.ob{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

#pbil{position:fixed;inset:0;z-index:9999;background:#d9d6d6;overflow:auto;font-family:Barlow,system-ui,sans-serif;color:#241c1d}
#pbil .pbbar{position:sticky;top:0;z-index:2;background:#2a2a2e;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#pbil .pbbar b{font-size:18px;margin-right:auto}
#pbil .pbbar .btn{min-height:46px;font-size:16px;font-weight:600;background:#c8102e;color:#fff;border:2px solid #fff}
#pbil .pbbar .btn.sec{background:#fff;color:#241c1d;border:2px solid #fff}
#pbil .pbhint{max-width:794px;margin:12px auto;padding:0 14px;font-size:15px;line-height:1.4}
#pbil .pbp{width:794px;height:1120px;box-sizing:border-box;background:#fff;margin:14px auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#pbil .pbh{position:relative;background:#2a2a2e;color:#fff;padding:22px 48px 16px;border-bottom:8px solid #c8102e}
#pbil .pbh img{position:absolute;right:36px;top:12px;height:72px;width:auto;background:#fff;border-radius:10px;padding:4px 10px;box-sizing:content-box}
#pbil .pbh i{display:block;font-style:normal;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#d9d6d6}
#pbil .pbh h1{margin:4px 0 0;font:700 38px/1.05 'Barlow Condensed',Barlow,sans-serif;color:#fff}
#pbil .pbb{padding:16px 48px 0;display:flex;flex-direction:column;gap:12px;flex-grow:1;min-height:0}
#pbil .pbf{display:flex;gap:24px;font-size:16px}
#pbil .pbf div{display:flex;gap:8px;align-items:flex-end;flex-grow:1}
#pbil .pbf div.c{flex-grow:0;width:130px}
#pbil .pbf span.v{flex-grow:1;border-bottom:1.5px solid #241c1d;min-height:24px;font-weight:600;font-size:18px}
#pbil table{border-collapse:collapse;width:100%;border:1.5px solid #241c1d;font-size:16px}
#pbil th{background:#f1eded;font-size:14px;font-weight:600;padding:8px 10px;border-bottom:1.5px solid #241c1d;text-align:center}
#pbil th:first-child,#pbil td:first-child{text-align:left}
#pbil td{padding:9px 10px;border-bottom:1px solid #cfc8c8;text-align:center}
#pbil .pbn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#c8102e;color:#fff;font-weight:600;font-size:15px;margin-right:10px}
#pbil .pbx{display:inline-grid;place-items:center;height:30px;border:1.5px solid #241c1d;border-radius:6px;box-sizing:border-box;font-weight:600;font-size:15px}
#pbil .pbm{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid;box-sizing:border-box;margin:0 5px;vertical-align:middle}
#pbil .pbby{display:inline-block;min-width:96px;border-bottom:1.5px solid #241c1d;min-height:24px;font-size:14px;font-weight:600}
#pbil .pbt{font-size:13px;color:#6a6061;padding:8px 10px;text-align:left}
#pbil .pbg{display:flex;gap:16px}
#pbil .pbc{border:1.5px solid #e4dddd;border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
#pbil .pbc b{font-size:17px}
#pbil .pbl{display:flex;align-items:center;gap:10px;font-size:15px}
#pbil .pbk{width:16px;height:16px;border:1.5px solid #241c1d;border-radius:3px;box-sizing:border-box;flex-shrink:0;display:grid;place-items:center;font-size:13px;line-height:1;font-weight:700}
#pbil .pbw{display:flex;gap:8px;align-items:flex-end;font-size:16px;margin-bottom:14px}
#pbil .pbw span.l{flex-grow:1;border-bottom:1.5px solid #241c1d;height:20px}
#pbil .pbo{border:1.5px solid #241c1d;border-radius:10px;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;flex-grow:1;min-height:60px;font-size:15px;line-height:1.4}
#pbil .pbo em{font-style:normal;min-height:44px}
#pbil .pbs{margin-top:auto;text-align:right;font-size:14px;color:#6a6061}
#pbil .pbz{padding:12px 48px 20px;display:flex;justify-content:space-between;font-size:13px;color:#6a6061}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#pbil){display:none!important}
  #pbil{position:static;overflow:visible;background:#fff}
  #pbil .pbbar,#pbil .pbhint{display:none!important}
  #pbil .pbp{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  #pbil .pbp:last-child{break-after:auto;page-break-after:auto}
  #pbil *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const barFor=d=>{let r=S.bar[0];for(const b of S.bar)if(d>=b[0])r=b;return r};
const rankOf=(pts,p)=>{let n=1;for(const k in pts)if(pts[k]>p)n++;return n};

function compute(){
  const pts={},st={};
  S.players.forEach(p=>{pts[p.id]=+p.init;st[p.id]={m:0,w:0,l:0}});
  const log=S.matches.map(m=>{
    const rw=rankOf(pts,pts[m.w]),rl=rankOf(pts,pts[m.l]),b=barFor(rw-rl);
    pts[m.w]+=b[1];pts[m.l]+=b[2];
    st[m.w].m++;st[m.w].w++;st[m.l].m++;st[m.l].l++;
    return {id:m.id,date:m.date,wi:m.w,li:m.l,wn:P(m.w).name,ln:P(m.l).name,rw,rl,pw:b[1],pl:b[2]};
  });
  const rows=S.players.map(p=>({id:p.id,name:p.name,init:+p.init,pts:pts[p.id],...st[p.id]}));
  rows.sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name,"fr"));
  rows.forEach(r=>r.rank=rankOf(pts,r.pts));
  return {pts,rows,log};
}

function cropPhoto(src,sx,sy,sw,sh){
  const c=document.createElement("canvas");c.width=96;c.height=128;
  const r=Math.max(96/sw,128/sh),w=sw*r,h=sh*r;
  c.getContext("2d").drawImage(src,sx,sy,sw,sh,(96-w)/2,(128-h)/2,w,h);
  return c.toDataURL("image/jpeg",.85);
}
let pdfjsP=null;
async function blobUrl(u){const r=await fetch(u);if(!r.ok)throw 0;return URL.createObjectURL(await r.blob())}
function loadPdfjs(){
  if(pdfjsP)return pdfjsP;
  const C="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/";
  pdfjsP=(async()=>{
    try{
      const V=C+"4.4.168/",lib=await import(V+"pdf.min.mjs");
      try{lib.GlobalWorkerOptions.workerSrc=await blobUrl(V+"pdf.worker.min.mjs")}catch(e){lib.GlobalWorkerOptions.workerSrc=V+"pdf.worker.min.mjs"}
      return lib;
    }catch(e){}
    const V=C+"3.11.174/";
    await new Promise((ok,ko)=>{const s=document.createElement("script");s.src=V+"pdf.min.js";s.onload=ok;s.onerror=()=>ko(new Error("pdf.js"));document.head.appendChild(s)});
    try{pdfjsLib.GlobalWorkerOptions.workerSrc=await blobUrl(V+"pdf.worker.min.js")}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=V+"pdf.worker.min.js"}
    return pdfjsLib;
  })();
  pdfjsP.catch(()=>{pdfjsP=null});
  return pdfjsP;
}
async function readPdf(file){
  const lib=await loadPdfjs(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[],O=lib.OPS,SC=3;
  for(let pn=1;pn<=doc.numPages;pn++){
    const page=await doc.getPage(pn),vp=page.getViewport({scale:SC}),cv=document.createElement("canvas");
    cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    await page.render({canvasContext:cv.getContext("2d"),canvas:cv,viewport:vp}).promise;
    const ol=await page.getOperatorList(),imgs=[];
    let ctm=[1,0,0,1,0,0];const st=[];
    ol.fnArray.forEach((fn,i)=>{
      const a=ol.argsArray[i];
      if(fn==O.save)st.push(ctm.slice());
      else if(fn==O.restore){if(st.length)ctm=st.pop()}
      else if(fn==O.transform)ctm=lib.Util.transform(ctm,a);
      else if(fn==O.paintImageXObject||fn==O.paintInlineImageXObject||fn==O.paintJpegXObject){
        const m=lib.Util.transform(vp.transform,ctm),xs=[m[4],m[0]+m[2]+m[4],m[0]+m[4],m[2]+m[4]],ys=[m[5],m[1]+m[3]+m[5],m[1]+m[5],m[3]+m[5]];
        const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
        if(x1-x0>40&&y1-y0>40)imgs.push({x0,y0,x1,y1});
      }
    });
    const tc=await page.getTextContent(),tx=[];
    tc.items.forEach(it=>{
      if(!it.str.trim())return;
      const m=lib.Util.transform(vp.transform,it.transform);
      tx.push({s:it.str.trim(),x:m[4],y:m[5],w:it.width*SC});
    });
    imgs.forEach(im=>{
      const w=im.x1-im.x0,h=im.y1-im.y0,cx=(im.x0+im.x1)/2;
      const same=imgs.filter(o=>o!==im&&Math.abs(o.y0-im.y0)<h/2).map(o=>Math.abs((o.x0+o.x1)/2-cx));
      const pitch=same.length?Math.min(...same):w*1.4;
      const below=imgs.filter(o=>o.y0>im.y1-2&&Math.abs((o.x0+o.x1)/2-cx)<w).map(o=>o.y0);
      const lim=below.length?Math.min(...below):im.y1+h;
      const c=tx.filter(t=>t.y>im.y1-2&&t.y<lim&&Math.abs(t.x+t.w/2-cx)<pitch/2);
      if(!c.length)return;
      const y=Math.min(...c.map(t=>t.y)),name=c.filter(t=>Math.abs(t.y-y)<6).sort((a,b)=>a.x-b.x).map(t=>t.s).join(" ").replace(/\s+/g," ").trim();
      if(!name)return;
      out.push({name,photo:cropPhoto(cv,im.x0+1,im.y0+1,w-2,h-2),y:Math.round(im.y0/(h/2)),x:im.x0});
    });
  }
  out.sort((a,b)=>a.y-b.y||a.x-b.x);
  return out;
}
function readImg(file){
  return new Promise(ok=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const ph=cropPhoto(img,0,0,img.width,img.height);URL.revokeObjectURL(u);ok({name:file.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim(),photo:ph})};
    img.onerror=()=>{URL.revokeObjectURL(u);ok(null)};
    img.src=u;
  });
}
function fixAccents(r){
  const all=r.map(x=>x.name).join("");
  if(!/[^\x00-\x7f]/.test(all)||/[éèêëàâîïôùûüç]/.test(all))return;
  try{
    const mac=new TextDecoder("macintosh"),w=new TextDecoder("windows-1252"),m={};
    for(let b=128;b<256;b++)m[mac.decode(new Uint8Array([b]))]=w.decode(new Uint8Array([b]));
    r.forEach(x=>{x.name=Array.from(x.name).map(c=>c.charCodeAt(0)<128?c:(m[c]||c)).join("")});
  }catch(e){}
}
async function importFiles(files){
  const I=ui.imp;I.busy=true;I.msg="Lecture en cours…";render();
  let n0=I.rows.length,err="";
  for(const f of files){
    try{
      if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){
        const r=await readPdf(f);
        fixAccents(r);
        r.forEach(x=>I.rows.push({name:I.sw?swapName(x.name):x.name,photo:x.photo,on:true}));
        if(!r.length)err="Aucune photo accompagnée d’un nom n’a été trouvée dans ce PDF (il s’agit peut-être d’un scan). Essayez des images séparées ou collez la liste des noms.";
      }else{
        const x=await readImg(f);if(x)I.rows.push({name:x.name,photo:x.photo,on:true});
      }
    }catch(e){err="Lecture impossible : "+(e&&e.message=="pdf.js"?"le lecteur de PDF n’a pas pu être chargé (connexion ?). Utilisez des images séparées ou collez les noms.":"fichier illisible.")}
  }
  I.busy=false;I.msg=err||`${I.rows.length-n0} élève${I.rows.length-n0>1?"s":""} trouvé${I.rows.length-n0>1?"s":""}. Vérifiez les noms ci-dessous puis validez.`;
  render();
}

function qrMatrix(text,eclName){
  const ecl=eclName=="L"?0:1,EB=eclName=="L"?1:0;
  const ECC=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22],[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24]];

  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const bytes=Array.from(new TextEncoder().encode(text));
  let ver=1;
  for(;ver<=15;ver++){const cap=Math.floor(raw(ver)/8)-ECC[ecl][ver]*NB[ecl][ver];const need=4+(ver<=9?8:16)+bytes.length*8;if(need<=cap*8)break}
  if(ver>15)throw new Error("trop long");
  const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
  const cap=Math.floor(raw(ver)/8)-ECC[ecl][ver]*NB[ecl][ver];
  put(0,Math.min(4,cap*8-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const divisor=d=>{const r=Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rem=(dat,dv)=>{const r=dv.map(()=>0);for(const b of dat){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const nb=NB[ecl][ver],el=ECC[ecl][ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=divisor(el),blocks=[];

    setTimeout(()=>{b.classList.remove("armed");b.textContent=t},3000);return;
  }
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener("change",e=>{

  if(k=="medsig"){
    if(P(ui.pj))E({t:"medsig",pid:+ui.pj,e:+t.dataset.v,v:t.value?+t.value:0});
    save();render();return;
  }
  if(k=="impf"){const fs=Array.from(t.files||[]);t.value="";if(fs.length)importFiles(fs);return}
  if(k=="impon"){ui.imp.rows[+t.dataset.i].on=t.checked;render();return}
  if(k=="impn"){ui.imp.rows[+t.dataset.i].name=t.value;render();return}

  if(k=="impi"){ui.imp.init=+t.value||0;return}
  if(k=="impsw"){ui.imp.sw=t.checked;return}
  if(k=="photo"){

    img.onload=()=>{
      const c=document.createElement("canvas");c.width=96;c.height=128;

      c.getContext("2d").drawImage(img,(96-w)/2,(128-h)/2,w,h);
      p.photo=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(u);save();render();
    };
    img.onerror=()=>{URL.revokeObjectURL(u);alert("Image illisible : choisissez un fichier JPG ou PNG.")};
    img.src=u;return;
  }
  const TB=TR()&&TR().tables[ui.tt];
  if(k=="tsz")ui.ts=+t.value;
  else if(k=="tk")ui.tk=t.value;
  else if(k=="tterr"&&TB)E({t:"tterr",ti:ui.tn,tt:ui.tt,v:t.value});
  else if(k=="tscore"&&TB){const v=t.value===""?null:Math.max(0,Math.floor(+t.value)||0);E({t:"tscore",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:+t.dataset.p,v})}
  else if(k=="st"&&TB)E({t:"st",ti:ui.tn,tt:ui.tt,mi:ui.tm,sp:+t.dataset.p,k:t.dataset.k,v:t.value===""?null:(["pf","pf2","pt","pt2"].includes(t.dataset.k)?t.value:+t.value)});
  else if(k=="oname"){S.obs[+t.dataset.i].n=t.value.trim();ui.od=true}
  else if(k=="ow"){S.obs[+t.dataset.i].w=+t.value||0;ui.od=true}
  else if(k=="ocount"){S.obs[+t.dataset.i].c=t.checked;ui.od=true}
  else if(k=="pj"){ui.pj=t.value;ui.mbp="";ui.mbn="";ui.mbm=""}
  else if(k=="gs")ui.gs=+t.value;
  else if(k=="pres"){ui.ab[t.dataset.v]=!t.checked;ui.gd=true}
  else if(k=="w")ui.w=t.value;
  else if(k=="l")ui.l=t.value;
  else if(k=="d")ui.date=t.value||today();
  else if(k=="ren")P(t.dataset.v).name=t.value.trim()||P(t.dataset.v).name;
  else if(k=="init")P(t.dataset.v).init=+t.value||0;
  else if(k=="bar"){S.bar[t.dataset.i][t.dataset.j]=+t.value;S.bar.sort((a,b)=>a[0]-b[0])}
  else if(k=="title")S.title=t.value.trim()||"Tennis de table 4ème";
  save();render();
});
const BUILD="20261126-114950";let HOSTED=true;
async function chkUpdate(){
  if(!HOSTED||location.protocol!="https:")return;
  try{
    const r=await fetch(location.pathname,{cache:"no-store"});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD="([^"]+)"/);
    const u=new URL(location.href);
    if(m&&m[1]!=BUILD&&u.searchParams.get("v")!=m[1]&&!editing()){u.searchParams.set("v",m[1]);location.replace(u.toString())}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")chkUpdate()});

render();chkUpdate();
if(LINK){pullSnap();setInterval(pullSnap,4000)}else if(SY.url&&SY.secret){doPush();startSync()}
